name: pda

x-env-files: &env-files
  env_file:
    - path: .env.example
    - path: .env
      required: false

x-app: &app
  build: .
  image: pda:local
  # A replica that dies (exit != 0: a server that stopped, a panic, an OOM kill)
  # comes back; a clean stop (0) and docker compose stop/kill do not restart it.
  restart: on-failure
  env_file:
    - path: .env.example
    - path: .env
      required: false
  environment:
    LOG_LEVEL: info
    AWS_SHARED_CREDENTIALS_FILE: /aws/credentials
    AWS_PROFILE: pda-wallet-service
  volumes:
    - ./.local/aws:/aws:ro
  depends_on:
    postgres:
      condition: service_healthy
    migrate:
      condition: service_completed_successfully
    aws-init:
      condition: service_completed_successfully
    keycloak:
      condition: service_healthy # JWKS fetched on start (fail fast, D-07)
  healthcheck:
    test: ["CMD", "/pda", "healthcheck"]
    interval: 5s
    timeout: 4s
    retries: 12
    start_period: 5s

services:
  postgres:
    image: postgres:18.6-alpine
    <<: *env-files
    ports: ["5432:5432"]
    volumes:
      - ./deploy/postgres/01-roles.sh:/docker-entrypoint-initdb.d/01-roles.sh:ro
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d pda"]
      interval: 2s
      timeout: 3s
      retries: 30

  # Applies migrations/ as pda_owner (data-model §7). The URL comes from the
  # env_file, which compose does not interpolate, so a shell expands it.
  migrate:
    image: migrate/migrate:v4.20.1
    <<: *env-files
    entrypoint: ["sh", "-c", "exec migrate -path /migrations -database \"$$DATABASE_OWNER_URL\" \"$$@\"", "migrate"]
    command: ["up"]
    volumes:
      - ./migrations:/migrations:ro
    depends_on:
      postgres:
        condition: service_healthy

  keycloak:
    image: quay.io/keycloak/keycloak:26.7.4
    <<: *env-files
    command: ["start-dev", "--import-realm"]
    environment:
      KC_HOSTNAME: http://localhost:8080
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      KC_HEALTH_ENABLED: "true"
    ports: ["8080:8080"]
    volumes:
      - ./deploy/keycloak:/opt/keycloak/data/import:ro
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/localhost/9000 && printf 'GET /health/ready HTTP/1.0\\r\\nHost: localhost\\r\\n\\r\\n' >&3 && read -r line <&3 && [[ $$line == *' 200 '* ]]"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 60s

  ministack:
    image: ministackorg/ministack:1.5.18
    environment:
      AUTH: "true"
    ports: ["4566:4566"]

  aws-init:
    image: amazon/aws-cli:2.36.31
    <<: *env-files
    entrypoint: ["bash", "/deploy/aws/init.sh"]
    environment:
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
    volumes:
      - ./deploy/aws:/deploy/aws:ro
      - ./.local/aws:/aws-shared
    depends_on:
      ministack:
        condition: service_healthy

  app-1:
    <<: *app
    ports: ["8081:8080", "9091:9090"]

  app-2:
    <<: *app
    ports: ["8082:8080", "9092:9090"]

  app-3:
    <<: *app
    ports: ["8083:8080", "9093:9090"]

  # Dashboard (D-22): Prometheus scrapes the admin port of the replicas and
  # Grafana shows the provisioned dashboard at localhost:3000 (anonymous viewer).
  prometheus:
    image: prom/prometheus:v3.15.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=2d
      # Injects a 0 sample at each counter's start timestamp (protobuf scrape),
      # so rate() sees the first increment of a label set that appears late.
      - --enable-feature=created-timestamp-zero-ingestion
    ports: ["9090:9090"]
    volumes:
      - ./deploy/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:9090/-/ready"]
      interval: 5s
      timeout: 3s
      retries: 12

  grafana:
    image: grafana/grafana:13.2.3
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/pda.json
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: "false"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
    ports: ["3000:3000"]
    volumes:
      - ./deploy/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./deploy/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./deploy/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      prometheus:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:3000/api/health"]
      interval: 5s
      timeout: 3s
      retries: 24
      start_period: 10s

  # Load test (test-plan §9, D-21): started only by scripts/load-test.sh
  # (make load-test) against the replicas already running.
  k6:
    image: grafana/k6:2.3.0
    profiles: [load]
    <<: *env-files # PROVIDER_A_SECRET and WALLET_SERVICE_SECRET
    user: "${LOAD_UID:-12345}:${LOAD_GID:-12345}"
    environment:
      RATE: ${RATE:-200}
      DURATION: ${DURATION:-60s}
      WALLETS: ${WALLETS:-1000}
    volumes:
      - ./test/load:/scripts:ro
      - ./.local/load:/out
    command: ["run", "--quiet", "/scripts/wager.js"]

volumes:
  pgdata:
