name: pda

x-env-files: &env-files
  env_file:
    - path: .env.example
    - path: .env
      required: false

x-app: &app
  build: .
  image: pda:local
  env_file:
    - path: .env.example
    - path: .env
      required: false
  environment:
    LOG_LEVEL: info
    AWS_SHARED_CREDENTIALS_FILE: /aws/credentials
    AWS_PROFILE: pda-wallet-service
  volumes:
    - ./.local/aws:/aws:ro
  depends_on:
    postgres:
      condition: service_healthy
    aws-init:
      condition: service_completed_successfully
  healthcheck:
    test: ["CMD", "/pda", "healthcheck"]
    interval: 5s
    timeout: 4s
    retries: 12
    start_period: 5s

services:
  postgres:
    image: postgres:18.6-alpine
    <<: *env-files
    ports: ["5432:5432"]
    volumes:
      - ./deploy/postgres/01-roles.sh:/docker-entrypoint-initdb.d/01-roles.sh:ro
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d pda"]
      interval: 2s
      timeout: 3s
      retries: 30

  keycloak:
    image: quay.io/keycloak/keycloak:26.7.4
    <<: *env-files
    command: ["start-dev", "--import-realm"]
    environment:
      KC_HOSTNAME: http://localhost:8080
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      KC_HEALTH_ENABLED: "true"
    ports: ["8080:8080"]
    volumes:
      - ./deploy/keycloak:/opt/keycloak/data/import:ro
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/localhost/9000 && printf 'GET /health/ready HTTP/1.0\\r\\nHost: localhost\\r\\n\\r\\n' >&3 && read -r line <&3 && [[ $$line == *' 200 '* ]]"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 60s

  ministack:
    image: ministackorg/ministack:1.5.18
    environment:
      AUTH: "true"
    ports: ["4566:4566"]

  aws-init:
    image: amazon/aws-cli:2.36.31
    <<: *env-files
    entrypoint: ["bash", "/deploy/aws/init.sh"]
    environment:
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
    volumes:
      - ./deploy/aws:/deploy/aws:ro
      - ./.local/aws:/aws-shared
    depends_on:
      ministack:
        condition: service_healthy

  app-1:
    <<: *app
    ports: ["8081:8080", "9091:9090"]

  app-2:
    <<: *app
    ports: ["8082:8080", "9092:9090"]

  app-3:
    <<: *app
    ports: ["8083:8080", "9093:9090"]

volumes:
  pgdata:
