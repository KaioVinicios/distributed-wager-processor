# Runs the unit, integration and e2e suites (docs/test-plan.md). Lint, build
# and deploy stay out on purpose.
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: go test -race ./...
        run: make test

  integration:
    name: Integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      # infra-up: PostgreSQL, Keycloak and MiniStack from the compose, then
      # aws-init (queues, topic, IAM users, .local/aws/credentials) and migrate.
      - name: make test-integration
        run: make test-integration
      - name: Compose logs
        if: failure()
        run: docker compose logs --no-color postgres keycloak ministack aws-init migrate
      - name: Tear down
        if: always()
        run: docker compose down -v

  e2e:
    name: E2E tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      # infra-up, then 3 processes of the binary the tests build with
      # -tags faultinject -race (test-plan §3.4).
      - name: make test-e2e
        run: make test-e2e
      - name: Compose logs
        if: failure()
        run: docker compose logs --no-color postgres keycloak ministack aws-init migrate
      - name: Tear down
        if: always()
        run: docker compose down -v
