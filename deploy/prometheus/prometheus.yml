# Scrapes the admin port (:9090, D-18) of the three replicas. The instance
# label keeps only the service name (app-1, app-2, app-3).
global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: pda
    static_configs:
      - targets: ["app-1:9090", "app-2:9090", "app-3:9090"]
    relabel_configs:
      - source_labels: [__address__]
        regex: "([^:]+):.*"
        target_label: instance
