apiVersion: 1

# The dashboards are files under version control: changes made in the UI are
# not saved (export the JSON and replace deploy/grafana/dashboards/pda.json).
providers:
  - name: pda
    folder: PDA
    type: file
    disableDeletion: true
    allowUiUpdates: false
    options:
      path: /var/lib/grafana/dashboards
